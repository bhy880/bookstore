<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
</head>
<body>
    <h1>Edit Book</h1>

    <form th:object="${book}" th:action="@{/save}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="author">Author</label>
        <input id="author" type="text" th:field="*{author}">

        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}">

        <label for="isbn">ISBN</label>
        <input id="isbn" type="number" th:field="*{isbn}">

        <label for="publicationYear">Publication Year</label>
        <input id="publicationYear" type="number" th:field="*{publicationYear}">

        <label for="price">Price</label>
        <input id="price" type="number"  th:field="*{price}" >

          <label for="catlist">Category</label>
			 <select id="catlist" th:field="*{category}" class="form-control">
       			<option th:each="category: ${categorys}" th:value="${category.categoryid}" th:text="${category.name}"></option>
    		</select>
            
        <button type="submit">Save</button>
    </form>

</body>
</html>
